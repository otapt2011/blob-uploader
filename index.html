<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel Blob Uploader</title>
    <style>
        body { padding: 20px; font-family: sans-serif; background: #111; color: #eee; }
        input, button { padding: 12px; border-radius: 6px; border: none; margin: 8px 0; width: 100%; box-sizing: border-box; }
        button { background: #057c94; color: #fff; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.6; }
        #result { margin-top: 20px; }
        #result a { color: #22d3ee; word-break: break-all; }
        
        /* Styles for the storage list */
        #list-container { margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
        .file-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 12px; }
        .file-link { color: #22d3ee; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-meta { color: #888; text-align: right; }
    </style>
</head>
<body>
    <h2>Upload a File</h2>
    
    <input type="file" id="fileInput" />
    <button id="uploadBtn">Upload File</button>

    <div id="result"></div>

    <hr style="border-color: #333; margin: 20px 0;">

    <h2>Stored Files</h2>
    <button id="listBtn">Refresh Storage List</button>
    <div id="list-container"></div>

    <script>
        // --- UPLOAD LOGIC ---
        document.getElementById('uploadBtn').addEventListener('click', async function() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) { alert("Please select a file first."); return; }

            const btn = this;
            btn.textContent = "Uploading..."; btn.disabled = true;

            try {
                const response = await fetch(`/api/upload?filename=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
                if (!response.ok) { const err = await response.json(); throw new Error(err.error || 'Upload failed'); }
                
                const data = await response.json();
                document.getElementById('result').innerHTML = `
                    <p style="color: #4ade80;">✅ Upload successful!</p>
                    <a href="/api/view?pathname=${data.pathname}" target="_blank">🔗 View / Download file</a>
                `;
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.textContent = "Upload File"; btn.disabled = false;
            }
        });

        // --- LIST LOGIC ---
        document.getElementById('listBtn').addEventListener('click', async function() {
            const container = document.getElementById('list-container');
            const btn = this;
            btn.textContent = "Loading..."; btn.disabled = true;
            container.innerHTML = "";

            try {
                const response = await fetch('/api/list');
                if (!response.ok) { const err = await response.json(); throw new Error(err.error || 'Failed to fetch list'); }
                
                const data = await response.json();
                
                if (data.blobs.length === 0) {
                    container.innerHTML = "<p style='color: #888; text-align: center;'>No files uploaded yet.</p>";
                    return;
                }

                let html = "";
                data.blobs.forEach(f => {
                    html += `
                        <div class="file-item">
                            <span class="file-link"><a href="${f.url}" target="_blank">${f.pathname}</a></span>
                            <span class="file-meta">${(f.size / 1024).toFixed(1)} KB</span>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `<p style="color: #f87171;">Error: ${error.message}</p>`;
            } finally {
                btn.textContent = "Refresh Storage List"; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
