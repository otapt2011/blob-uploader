<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel Blob Uploader</title>
    <style>
        body { padding: 20px; font-family: sans-serif; background: #111; color: #eee; }
        input, button { padding: 12px; border-radius: 6px; border: none; margin: 8px 0; width: 100%; box-sizing: border-box; }
        button { background: #057c94; color: #fff; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; }
        #result a { color: #22d3ee; word-break: break-all; }
    </style>
</head>
<body>
    <h2>Upload a File</h2>
    
    <input type="file" id="fileInput" />
    <button id="uploadBtn">Upload File</button>

    <div id="result"></div>

    <!-- 1. Define where the browser can find the Vercel Blob Client -->
    <script type="importmap">
        {
            "imports": {
                "@vercel/blob/client": "https://esm.sh/@vercel/blob/client@0.24.0"
            }
        }
    </script>

    <!-- 2. The main script that uses the client SDK -->
    <script type="module">
        import { upload } from '@vercel/blob/client';

        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file first.");

            const btn = document.getElementById('uploadBtn');
            btn.textContent = "Uploading...";
            btn.disabled = true;

            try {
                // ✅ The SDK automatically does the preflight request to /api/upload
                const blob = await upload(file.name, file, {
                    access: 'public',
                    handleUploadUrl: '/api/upload', // Matches your backend endpoint
                });

                document.getElementById('result').innerHTML = `
                    <p style="color: #4ade80;">✅ Upload successful!</p>
                    <a href="${blob.url}" target="_blank">🔗 View / Download file</a>
                `;
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                btn.textContent = "Upload File";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
